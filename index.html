<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotelSync · Gestão hoteleira</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#182230;--muted:#6b7788;--line:#e5e9f0;--brand:#2457d6;--brand2:#eaf0ff;--green:#13865b;--red:#c43d4d;--amber:#a96b09;--shadow:0 8px 28px #1b2a4410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.side{background:#111c31;color:#e9eef8;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;padding:0 10px}.mark{background:#3769e8;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:white}.side small{color:#9eabc1;letter-spacing:.09em;font-size:10px;font-weight:800;padding:0 12px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd5e5;text-align:left;padding:11px 12px;font-weight:550}.nav button.active,.nav button:hover{background:#243552;color:white}.side-foot{margin-top:auto;color:#9eabc1;font-size:12px;padding:10px}
main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.top h1{font-size:18px;margin:0}.topright{display:flex;align-items:center;gap:12px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:#e9efff;color:var(--brand);display:grid;place-items:center;font-weight:800}
.content{padding:28px 30px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.welcome h2{margin:0 0 5px;font-size:24px}.muted{color:var(--muted)}.btn{background:var(--brand);color:white}.btn.secondary{background:#eef2f8;color:#344054}.btn.ghost{background:transparent;color:var(--brand);padding:7px}.btn.danger{background:#fff0f1;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:18px}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;margin:7px 0 2px}.metric .hint{font-size:11px;color:var(--muted)}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h3{font-size:16px;margin:0}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eef1f5}tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2f8;color:#526071}.pill.green{background:#e7f7ef;color:#14764f}.pill.red{background:#fff0f1;color:#b82f40}.pill.amber{background:#fff5df;color:#956009}.pill.blue{background:#eaf0ff;color:#2457d6}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#465367}.field input,.field select{border:1px solid #dce2eb;border-radius:9px;padding:10px 11px;background:#fff;min-width:0;width:100%;color:var(--ink)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.formgrid .full{grid-column:1/-1}.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.room{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;min-width:0}.room-top{display:flex;align-items:center;justify-content:space-between;gap:5px}.room strong{font-size:16px}.room-free{background:#e9f8ef;border-color:#8ed3a6}.room-occupied{background:#e8f0ff;border-color:#8db2f3}.room-reserved{background:#fff7df;border-color:#e8ca70}.room-cleaning{background:#fff0d9;border-color:#e7b45b}.room-maintenance,.room-blocked{background:#fdeaea;border-color:#e6a0a0}.room-guest{font-weight:600;color:var(--ink)}.room small{display:block;color:var(--muted);margin:4px 0 8px}.room .pill{font-size:10px}.empty{text-align:center;padding:30px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#f8f9fc;border:1px solid var(--line);border-radius:8px;min-height:78px;padding:7px;font-size:11px}.day b{display:block;margin-bottom:6px}.bar{border-radius:5px;padding:3px 5px;background:#eaf0ff;color:#2457d6;white-space:normal;margin-top:3px;font-size:10px}.notice{padding:12px 14px;background:#fff8e8;border:1px solid #f5e4bd;border-radius:10px;color:#80580c;margin-bottom:16px;font-size:12px}.modalback{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:white;border-radius:16px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.close{background:#f0f2f6;color:#344054;padding:6px 10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hidden{display:none!important}.pricebox{padding:12px;background:#f4f7ff;border-radius:10px;color:#2449a3;margin:8px 0 14px}.inline-new{display:flex;gap:8px;align-items:end}.inline-new .field{flex:1}.checkline{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px}.checkline input{width:17px;height:17px}.discount-row{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:end}.subtle-note{font-size:11px;color:var(--muted);margin-top:-7px;margin-bottom:10px}.mobilemenu{display:none}
@media(min-width:1400px){.roomgrid{grid-template-columns:repeat(8,minmax(0,1fr))}}@media(min-width:1100px) and (max-width:1399px){.roomgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.roomgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.top{height:62px;padding:0 16px}.mobilemenu{display:inline-block;background:#eef2f8;color:#344054}.content{padding:20px 14px}.welcome{display:block}.welcome .btn{margin-top:12px}.cards{gap:9px}.metric{padding:13px}.metric strong{font-size:22px}.roomgrid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.topright .role{display:none}}

.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.room{padding:10px;min-height:112px;border-radius:12px}
.room-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.room-actions .btn{padding:6px 8px;font-size:11px}
.room-free{background:#e4f6eb!important;border:1px solid #9bd8b3!important}
.room-occupied{background:#ffe1e3!important;border:2px solid #d92d20!important;box-shadow:0 0 0 1px #fda29b inset!important}.room-occupied .pill{background:#b42318!important;color:#fff!important}.room-occupied .room-guest{color:#912018!important;font-weight:800}
.room-reserved{background:#fff5d9!important;border:1px solid #e8ca75!important}
.room-cleaning{background:#fff0dc!important;border:1px solid #e7b56e!important}
.room-maintenance,.room-blocked{background:#fde7e9!important;border:1px solid #e5a2aa!important}
.mini-room-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
.mini-room-day{border-radius:8px;padding:6px 3px;min-height:65px;display:flex;flex-direction:column;gap:2px;text-align:center;font-size:11px}
.mini-room-day.free{background:#e4f6eb}.mini-room-day.busy{background:#e3edff}
.mini-room-day small{font-size:9px;color:#536174}.day-occupancy{display:flex;gap:4px;align-items:baseline;margin-top:5px}
.day-occupancy strong{font-size:12px;color:#2457d6}.day-occupancy small{font-size:9px;color:var(--muted)}
.occupancy-track{height:4px;background:#e8edf5;border-radius:5px;margin:3px 0 5px;overflow:hidden}.occupancy-track i{display:block;height:100%;background:#2457d6}
@media(max-width:900px){.roomgrid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}}

/* Autenticação Supabase */
body:not(.authenticated) .app{display:none}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#101c33,#1f3c70)}
#loginCard{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 24px 70px #0004}
#loginCard .logo{padding:0;color:#182230;margin-bottom:22px}
#loginCard h1{font-size:24px;margin:0 0 6px}
#loginCard p{color:#6b7788;margin:0 0 22px}
#loginCard input{width:100%;padding:12px;border:1px solid #dce2eb;border-radius:9px}
#loginCard label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:#465367}
#loginCard .field{margin-bottom:14px}
#loginError{display:none;background:#fff0f1;color:#b42318;padding:10px;border-radius:8px;margin:12px 0;font-size:13px}
#loginInfo{font-size:11px;color:#667085;margin-top:14px;line-height:1.5}
#logoutBtn{background:#eef2f8;color:#344054;padding:8px 10px}
@media(max-width:520px){#loginCard{padding:22px}}
</style>
</head>
<body>
<section id="loginScreen">
 <div id="loginCard">
  <div class="logo"><span class="mark">H</span> HotelSync</div>
  <h1>Acessar o sistema</h1>
  <p>Entre com seu e-mail e senha cadastrados no HotelSync.</p>
  <form id="loginForm">
   <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="seuemail@hotel.com"></div>
   <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Sua senha"></div>
   <button class="btn" id="loginSubmit" type="submit" style="width:100%">Entrar</button>
   <div id="loginError" role="alert"></div>
  </form>
  <div id="loginInfo">Acesso protegido pelo Supabase Auth. Seu perfil e suas permissões são carregados do banco de dados.</div>
 </div>
</section>
<div class="app">
<aside class="side">
 <div class="logo"><span class="mark">H</span> HotelSync</div>
 <small>GESTÃO DO HOTEL</small>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard">▦ &nbsp; Visão geral</button>
  <button data-page="reservations">▣ &nbsp; Reservas</button>
  <button data-page="archive">▤ &nbsp; Reservas encerradas</button>
  <button data-page="finalized">✓ &nbsp; Reservas finalizadas</button>
  <button data-page="calendar">▦ &nbsp; Calendário</button>
  <button data-page="rooms">▤ &nbsp; Quartos</button>
  <button data-page="cleaning">♧ &nbsp; Limpeza</button>
  <button data-page="breakfast">☕ &nbsp; Café da manhã</button>
  <button data-page="parking">▣ &nbsp; Estacionamento</button>
  <button data-page="guests">♙ &nbsp; Hóspedes</button>
  <button data-page="finance">＄ &nbsp; Financeiro</button>
  <button data-page="consumption">▣ &nbsp; Consumo e extras</button>
  <button data-page="products">▤ &nbsp; Produtos e estoque</button>
  <button data-page="services">✧ &nbsp; Serviços</button>
  <button data-page="cash">▣ &nbsp; Caixa</button>
  <button data-page="shifts">◷ &nbsp; Fechamento de turno</button>
  <button data-page="rates">↗ &nbsp; Tarifas</button>
  <button data-page="settings">⚙ &nbsp; Configurações</button>
 </nav>
 <div class="side-foot" id="sideUserInfo">Acesso autenticado<br>Dados locais do protótipo</div>
</aside>
<main>
 <header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="mobilemenu" onclick="toggleMobile()">☰</button><h1 id="pageTitle">Visão geral</h1></div><div class="topright"><span class="role" id="currentUserLabel">Não autenticado</span><span class="avatar" id="currentUserAvatar">?</span><button id="logoutBtn" type="button" onclick="hotelLogout()">Sair</button></div></header>
 <div class="content" id="content"></div>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const today=new Date(); today.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR');
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const seed=()=>{
 let cats=[{id:1,name:'Standard',base:220},{id:2,name:'Luxo',base:350},{id:3,name:'Suíte',base:490}];
 let rooms=Array.from({length:40},(_,i)=>({id:i+101,number:String(i+101),category:cats[i<20?0:i<32?1:2].name,status:'Disponível'}));
 let guests=[{id:1,name:'João Silva',phone:'(11) 99999-1001',email:'joao@email.com',document:'***.***.***-01'},{id:2,name:'Ana Costa',phone:'(11) 99999-1002',email:'ana@email.com',document:'***.***.***-02'},{id:3,name:'Pedro Santos',phone:'(11) 99999-1003',email:'pedro@email.com',document:'***.***.***-03'}];
 let reservations=[
 {id:1,guestId:1,room:'101',checkin:iso(addDays(today,1)),checkout:iso(addDays(today,4)),adults:2,children:0,channel:'Booking',status:'Confirmada',total:660,paid:330},
 {id:2,guestId:2,room:'121',checkin:iso(addDays(today,0)),checkout:iso(addDays(today,2)),adults:2,children:0,channel:'Airbnb',status:'Confirmada',total:700,paid:700},
 {id:3,guestId:3,room:'133',checkin:iso(addDays(today,3)),checkout:iso(addDays(today,6)),adults:1,children:0,channel:'Direta',status:'Pendente',total:1470,paid:0}
 ];
 let products=[
 {id:1,name:'Água mineral',category:'Bebidas',price:4,cost:1.8,stock:80,minStock:15,active:true},
 {id:2,name:'Refrigerante',category:'Bebidas',price:7,cost:3.5,stock:50,minStock:10,active:true},
 {id:3,name:'Chocolate',category:'Snacks',price:6,cost:2.8,stock:30,minStock:8,active:true}
 ];
 let services=[
 {id:1,name:'Café da manhã',unit:'pessoa/dia',price:25,active:true},
 {id:2,name:'Estacionamento',unit:'veículo/diária',price:30,active:true},
 {id:3,name:'Lavanderia',unit:'serviço',price:20,active:true}
 ];
 return {cats,rooms,guests,reservations,products,services,charges:[],cashMovements:[],hotel:'Hotel Demonstrativo',currency:'BRL',seasonMultiplier:1,highOccupancy:80,highMultiplier:1.2,lowMultiplier:0.9};
};
let db;try{db=JSON.parse(localStorage.getItem('hotelsync_db'))||seed()}catch(e){db=seed()}
function save(){localStorage.setItem('hotelsync_db',JSON.stringify(db))}
db.products ||= []; db.services ||= []; db.charges ||= []; db.cashMovements ||= []; db.payments ||= []; db.shifts ||= []; db.activeShiftId ||= null; db.cleaningTasks ||= []; db.breakfastAttendance ||= []; db.parkingVehicles ||= [];
if(!db.products.length) db.products=[{id:1,name:'Água mineral',category:'Bebidas',price:4,cost:1.8,stock:80,minStock:15,active:true},{id:2,name:'Refrigerante',category:'Bebidas',price:7,cost:3.5,stock:50,minStock:10,active:true},{id:3,name:'Chocolate',category:'Snacks',price:6,cost:2.8,stock:30,minStock:8,active:true}];
if(!db.services.length) db.services=[{id:1,name:'Café da manhã',unit:'pessoa/dia',price:25,active:true},{id:2,name:'Estacionamento',unit:'veículo/diária',price:30,active:true},{id:3,name:'Lavanderia',unit:'serviço',price:20,active:true}];
let page='dashboard';
function guest(id){return db.guests.find(g=>g.id==id)||{name:'Hóspede não identificado'}}
function active(r){return !r.closed&&r.status!=='Cancelada'&&r.status!=='Encerrada'}
function nights(a,b){return Math.max(1,Math.round((new Date(b)-new Date(a))/86400000))}
function occupancy(){return db.rooms.filter(r=>roomStatus(r)==='Ocupado').length}
function occupiedRoomsForToday(){return db.rooms.filter(r=>roomStatus(r)==='Ocupado')}
function roomStatus(room){
 if(['Manutenção','Bloqueado','Limpeza','Indisponível'].includes(room.status))return room.status;
 let r=db.reservations.find(x=>active(x)&&String(x.room)===String(room.number)&&x.checkin<=iso(today)&&x.checkout>iso(today));
 return r?(r.checkedIn?'Ocupado':'Reservado'):'Disponível';
}
function pill(s){let c=({'Disponível':'green','Confirmada':'green','Ocupado':'blue','Pendente':'amber','Cancelada':'red','Manutenção':'red','Indisponível':'red','Limpeza':'amber','Bloqueado':'red','Pago':'green','Parcial':'amber','Em aberto':'red'})[s]||'blue';return `<span class="pill ${c}">${s}</span>`}
function title(t,sub,btn=''){return `<div class="welcome"><div><h2>${t}</h2><div class="muted">${sub}</div></div>${btn}</div>`}
function pageNav(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=({dashboard:'Visão geral',reservations:'Reservas',archive:'Reservas encerradas',finalized:'Reservas finalizadas',calendar:'Calendário',rooms:'Quartos',cleaning:'Limpeza',breakfast:'Café da manhã',parking:'Estacionamento',guests:'Hóspedes',finance:'Financeiro',rates:'Tarifas',settings:'Configurações',consumption:'Consumo e extras',products:'Produtos e estoque',services:'Serviços',cash:'Caixa',shifts:'Fechamento de turno'})[p];render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)pageNav(b.dataset.page)});
function render(){
 let c=$('#content');
 if(page==='dashboard')c=dashboard(c);
 if(page==='rooms')roomsPage(c);
 if(page==='cleaning')cleaningPage(c);
 if(page==='breakfast')breakfastPage(c);
 if(page==='parking')parkingPage(c);
 if(page==='reservations')reservationsPage(c);
 if(page==='archive')archivePage(c);
 if(page==='finalized')finalizedPage(c);
 if(page==='calendar')calendarPage(c);
 if(page==='guests')guestsPage(c);
 if(page==='finance')financePage(c);
 if(page==='rates')ratesPage(c);
 if(page==='settings')settingsPage(c);
 if(page==='consumption')consumptionPage(c);
 if(page==='products')productsPage(c);
 if(page==='services')servicesPage(c);
 if(page==='cash')cashPage(c);
 if(page==='shifts')shiftsPage(c);
}
function dashboard(c){
 let occ=db.rooms.filter(r=>roomStatus(r)==='Ocupado').length;
 let avail=db.rooms.filter(r=>roomStatus(r)==='Disponível').length;
 let todayKey=iso(today),monthKey=todayKey.slice(0,7);
 let receivedToday=db.cashMovements.filter(x=>x.type==='Entrada'&&x.date===todayKey).reduce((sum,x)=>sum+Number(x.amount||0),0);
 let receivedMonth=db.cashMovements.filter(x=>x.type==='Entrada'&&String(x.date||'').slice(0,7)===monthKey).reduce((sum,x)=>sum+Number(x.amount||0),0);
 let sellable=occ+avail,pct=sellable?Math.round(occ/sellable*100):0;
 c.innerHTML=title('Bom dia 👋','Aqui está o resumo operacional do '+db.hotel+'.',`<button class="btn" onclick="newReservation()">＋ Nova reserva</button>`)+
 `<div class="notice">Ambiente de demonstração: os dados ficam salvos somente neste navegador. As conexões com Booking, Airbnb e pagamentos ainda não estão ativadas.</div>
 <div class="cards">
 <div class="card metric"><div class="label">Quartos ocupados</div><strong>${occ}</strong><div class="hint">Ocupados hoje</div></div>
 <div class="card metric"><div class="label">Quartos livres</div><strong>${avail}</strong><div class="hint">Disponíveis para hospedagem</div></div>
 <div class="card metric"><div class="label">Recebido hoje</div><strong>${money(receivedToday)}</strong><div class="hint">Entradas registradas no caixa</div></div>
 <div class="card metric"><div class="label">Recebido neste mês</div><strong>${money(receivedMonth)}</strong><div class="hint">Entradas desde o início do mês</div></div></div>
 <div class="grid2"><section class="panel"><div class="panel-head"><h3>Próximas chegadas</h3><button class="btn ghost" onclick="pageNav('reservations')">Ver reservas →</button></div>${arrivalTable()}</section>
 <section class="panel"><div class="panel-head"><h3>Ocupação de hoje</h3></div><div style="font-size:32px;font-weight:800">${pct}%</div><div style="height:10px;background:#edf0f5;border-radius:20px;margin:12px 0;overflow:hidden"><div style="height:100%;width:${pct}%;background:#2457d6"></div></div><div class="muted">${occ} ocupados · ${avail} livres</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3 style="margin-bottom:10px">Canais cadastrados</h3><div style="display:flex;gap:7px;flex-wrap:wrap"><span class="pill blue">Booking · Simulado</span><span class="pill blue">Airbnb · Simulado</span><span class="pill">Direta</span></div></section></div>`;
}

function roomStatusOnDate(room,date){
 if(['Manutenção','Limpeza','Bloqueado','Indisponível'].includes(room.status))return room.status;
 let r=db.reservations.find(x=>active(x)&&String(x.room)===String(room.number)&&x.checkin<=date&&x.checkout>date);
 if(!r)return 'Disponível';
 return date===iso(today)&&r.checkedIn?'Ocupado':'Reservado';
}
function roomCards(list,date){return list.map(r=>{
 let st=roomStatusOnDate(r,date),res=db.reservations.find(x=>active(x)&&String(x.room)===String(r.number)&&x.checkin<=date&&x.checkout>date);
 let cls=({'Disponível':'free','Ocupado':'occupied','Reservado':'reserved','Limpeza':'cleaning','Manutenção':'maintenance','Indisponível':'blocked','Bloqueado':'blocked'})[st]||'';
 let cleaningPending=(db.cleaningTasks||[]).some(t=>String(t.room)===String(r.number)&&t.status!=='Concluída');
 return `<div class="room room-${cls}"><div class="room-top"><strong>${r.number}</strong>${pill(st)}</div><small>${r.category}</small>${res?`<small class="room-guest">${guest(res.guestId).name}</small>`:''}${st==='Limpeza'||cleaningPending?`<div style="margin-top:7px;padding:6px 8px;border-radius:8px;background:#fff1cc;color:#854d0e;font-size:12px;font-weight:800">🧹 Em limpeza / aguardando</div>`:''}
 <div class="room-actions"><button class="btn ghost" onclick="showRoomMiniCalendar('${String(r.number).replace(/'/g,"\\'")}')">Ver calendário</button><button class="btn" onclick="newReservation(null,'${String(r.number).replace(/'/g,"\\'")}')">＋ Reservar</button><button class="btn ghost" onclick="requestRoomCleaning('${String(r.number).replace(/'/g,"\\'")}')">🧹 Solicitar limpeza</button><button class="btn ghost" onclick="editRoom('${String(r.number).replace(/'/g,"\\'")}')">Editar</button>${st==='Limpeza'||cleaningPending?`<button class="btn" onclick="openCleaningForRoom('${String(r.number).replace(/'/g,"\\'")}')">Ver limpeza</button>`:''}</div></div>`;
 }).join('')||'<div class="empty">Nenhum quarto encontrado.</div>'}
function showRoomMiniCalendar(number){

 window._roomCalendarOffset=0;
 modal('Calendário do quarto '+number,`<p>Disponibilidade do quarto <b>${number}</b> · ${room.category}</p>

 <div class="actions"><button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn" onclick="closeModal();newReservation(null,'${String(number).replace(/'/g,"\\'")}')">＋ Fazer reserva neste quarto</button></div>`);

 window._roomCalendarOffset=(window._roomCalendarOffset||0)+delta;

function drawRoomMiniCalendar(number){
 let room=db.rooms.find(x=>String(x.number)===String(number)),grid=$('#roomMiniCalendarGrid'),label=$('#roomMiniMonth');
 if(!room||!grid||!label)return;
 let base=new Date(today.getFullYear(),today.getMonth()+(window._roomCalendarOffset||0),1,12,0,0,0);
 label.textContent=base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 let offset=(base.getDay()+6)%7,first=addDays(base,-offset),days=Array.from({length:42},(_,i)=>addDays(first,i));
 grid.innerHTML=`<div class="mini-room-calendar">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="mini-room-day" style="min-height:auto;background:transparent;font-weight:700">${d}</div>`).join('')}${days.map(d=>{
  let date=iso(d),res=db.reservations.find(x=>active(x)&&String(x.room)===String(number)&&x.checkin<=date&&x.checkout>date);
  let status=res?(date===iso(today)?'Ocupado':'Reservado'):'Livre';
  let outside=d.getMonth()!==base.getMonth();
  return `<div class="mini-room-day ${res?'busy':'free'}" style="${outside?'opacity:.35':''}" title="${res?guest(res.guestId).name:'Livre'}"><b>${d.getDate()}</b><span>${status}</span>${res?`<small>${guest(res.guestId).name.split(' ')[0]}</small>`:''}</div>`;
 }).join('')}</div>`;
}
function finishRoomCleaning(number){

function filterRooms(){
 if(!$('#roomgrid'))return;
 let date=$('#roomDate').value||iso(today),s=$('#roomFilter').value,cat=$('#catFilter').value;
 let filtered=db.rooms.filter(r=>(!s||roomStatusOnDate(r,date)===s)&&(!cat||r.category===cat));
 let counts=['Disponível','Reservado','Ocupado','Indisponível','Manutenção','Limpeza','Bloqueado'].map(k=>[k,db.rooms.filter(r=>roomStatusOnDate(r,date)===k).length]);
 $('#roomSummary').innerHTML=`<div class="cards" style="margin:10px 0 0">${counts.map(([k,v])=>`<div class="card metric"><div class="label">${k}</div><strong>${v}</strong></div>`).join('')}</div><div class="muted" style="font-size:12px">Ocupação consultada para ${fmt(date)}. Reservas contam da entrada até a véspera da saída.</div>`;
 $('#roomgrid').innerHTML=roomCards(filtered,date);
}
let reservationSort={key:'room',direction:'asc'};
function normalizedReservationStatus(r){return String(r.status||'').trim().toLocaleLowerCase('pt-BR');}
function normalizedCloseReason(r){return String(r.closeReason||'').trim().toLocaleLowerCase('pt-BR');}
function isFinalizedReservation(r){
 let st=normalizedReservationStatus(r),reason=normalizedCloseReason(r);
 return st==='finalizada'||reason.includes('check-out realizado')||reason.includes('check out realizado')||reason.includes('check-out');
}
function isArchivedReservation(r){
 let st=normalizedReservationStatus(r),reason=normalizedCloseReason(r);
 if(isFinalizedReservation(r))return false;
 return !!r.closed||['encerrada','cancelada','cancelado'].includes(st)||reason.includes('cancelamento')||reason.includes('no-show')||reason.includes('não compareceu');
}

 `<div class="toolbar"><input id="finalizedSearch" placeholder="Buscar hóspede ou quarto..." oninput="filterFinalized()" style="padding:10px;border:1px solid var(--line);border-radius:9px;min-width:220px"><select id="finalizedPayment" onchange="filterFinalized()" style="padding:10px;border:1px solid var(--line);border-radius:9px"><option value="">Todos os pagamentos</option><option value="Pago">Pago</option><option value="Parcial">Parcial</option><option value="Em aberto">Em aberto</option></select><input id="finalizedDate" type="date" title="Data do check-out" onchange="filterFinalized()" style="padding:10px;border:1px solid var(--line);border-radius:9px"></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Quarto</th><th>Hóspede</th><th>Entrada</th><th>Saída prevista</th><th>Check-out</th><th>Total</th><th>Pagamento</th><th>Ações</th></tr></thead><tbody id="finalizedRows"></tbody></table></div></section>`;

function filterFinalized(){
 let q=($('#finalizedSearch')?.value||'').toLocaleLowerCase('pt-BR'),pay=$('#finalizedPayment')?.value||'',date=$('#finalizedDate')?.value||'';
 let rows=db.reservations.filter(isFinalizedReservation).filter(r=>(!pay||paymentStatus(r)===pay)&&(!date||r.closedAt===date)&&(guest(r.guestId).name.toLocaleLowerCase('pt-BR').includes(q)||String(r.room).toLowerCase().includes(q))).sort((a,b)=>String(b.closedAt||'').localeCompare(String(a.closedAt||'')));
 let body=$('#finalizedRows');
 if(body)body.innerHTML=rows.map(r=>`<tr><td><b>${r.room}</b></td><td>${guest(r.guestId).name}</td><td>${fmt(r.checkin)}</td><td>${fmt(r.checkout)}</td><td>${fmt(r.closedAt)} ${r.closedTime||''}</td><td>${money(Number(r.total||0)+extraTotal(r.id))}</td><td>${pill(paymentStatus(r))}</td><td><button class="btn ghost" onclick="showReservationStatement(${r.id})">Extrato</button> <button class="btn ghost" onclick="viewGuest(${r.guestId})">Hóspede</button> <button class="btn" onclick="editReservation(${r.id})">Corrigir datas</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma hospedagem finalizada.</td></tr>';

function reservationRows(rows,archived=false){
 if(archived)return rows.map(r=>`<tr><td><b>${r.room}</b></td><td>${guest(r.guestId).name}</td><td>${fmt(r.checkin)}</td><td>${fmt(r.checkout)}</td><td>${fmt(r.closedAt||r.checkout)}</td><td>${r.closeReason||'Não informado'}${r.closeNote?`<div class="muted">${r.closeNote}</div>`:''}</td><td>${money(r.total)}</td><td><button class="btn ghost" onclick="viewGuest(${r.guestId})">Hóspede</button> <button class="btn ghost" onclick="showReservationStatement(${r.id})">Extrato</button> <button class="btn ghost" onclick="editReservation(${r.id})">Editar</button> <button class="btn ghost" onclick="reopenReservation(${r.id})">Reabrir</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma reserva encerrada encontrada.</td></tr>';
 return rows.map(r=>`<tr><td><b>${r.room}</b></td><td>${guest(r.guestId).name}</td><td>${fmt(r.checkin)}</td><td>${fmt(r.checkout)}</td><td>${r.channel||'—'}</td><td>${money(r.total)}</td><td>${pill(paymentStatus(r))}</td><td>${pill(r.status)}</td><td><button class="btn ghost" onclick="viewGuest(${r.guestId})">Hóspede</button> <button class="btn ghost" onclick="showReservationStatement(${r.id})">Extrato</button> <button class="btn ghost" onclick="editReservation(${r.id})">Editar</button> ${r.checkedIn?'<span class="pill green">Hóspede no quarto</span>':`<button class="btn" onclick="checkinReservation(${r.id})">Check-in</button>`} <button class="btn" onclick="checkoutReservation(${r.id})">Check-out</button> <button class="btn secondary" onclick="closeReservation(${r.id})">Encerrar / cancelar</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Nenhuma reserva ativa encontrada.</td></tr>';
}
function sortReservations(key){
 if(reservationSort.key===key)reservationSort.direction=reservationSort.direction==='asc'?'desc':'asc';
 else {reservationSort.key=key;reservationSort.direction='asc';}
 filterReservations();
}
function filterReservations(){
 let q=($('#resSearch')?.value||'').trim().toLocaleLowerCase('pt-BR');
 let st=$('#resStatus')?.value||'';
 let rows=db.reservations.filter(r=>{
  let status=normalizedReservationStatus(r);
  let isOpen=!r.closed&&!isFinalizedReservation(r)&&!isArchivedReservation(r)&&['confirmada','pendente'].includes(status);
  return isOpen&&(!st||status===st.toLocaleLowerCase('pt-BR'))&&
   (guest(r.guestId).name.toLocaleLowerCase('pt-BR').includes(q)||String(r.room).toLocaleLowerCase('pt-BR').includes(q));
 });
 let key=reservationSort.key,dir=reservationSort.direction==='asc'?1:-1;
 const collator=new Intl.Collator('pt-BR',{numeric:true,sensitivity:'base'});
 rows.sort((a,b)=>{
  let av=key==='name'?guest(a.guestId).name:a[key];
  let bv=key==='name'?guest(b.guestId).name:b[key];
  if(key==='checkin'||key==='checkout')return String(av||'').localeCompare(String(bv||''))*dir;
  return collator.compare(String(av??''),String(bv??''))*dir;
 });
 let body=$('#resRows');if(body)body.innerHTML=reservationRows(rows);
 ['room','name','checkin','checkout'].forEach(k=>{let el=$('#sort-'+k);if(el)el.textContent=reservationSort.key===k?(reservationSort.direction==='asc'?'↑':'↓'):'↕';});
}
function filterArchive(){
 let q=($('#archiveSearch')?.value||'').toLocaleLowerCase('pt-BR'),st=$('#archiveStatus')?.value||'',reason=$('#archiveReason')?.value||'';
 let rows=db.reservations.filter(isArchivedReservation).filter(r=>(!st||r.status===st)&&(!reason||r.closeReason===reason)&&(guest(r.guestId).name.toLocaleLowerCase('pt-BR').includes(q)||String(r.room).toLowerCase().includes(q))).sort((a,b)=>String(b.closedAt||b.checkout).localeCompare(String(a.closedAt||a.checkout)));
 let body=$('#archiveRows');if(body)body.innerHTML=reservationRows(rows,true);
}
function checkinReservation(id){
 let r=db.reservations.find(x=>x.id===id);if(!r||!active(r))return;
 if(r.checkedIn)return alert('O check-in desta hospedagem já foi realizado.');
 if(r.checkin>iso(today))return alert('O check-in está previsto para '+fmt(r.checkin)+'. Não é possível registrar a entrada antes dessa data.');
 let room=db.rooms.find(x=>String(x.number)===String(r.room));
 if(!room)return alert('Quarto não encontrado.');
 if(['Indisponível','Manutenção','Bloqueado','Limpeza'].includes(room.status))return alert('Este quarto está '+room.status.toLowerCase()+' e não pode receber o hóspede.');
 let conflict=db.reservations.find(x=>x.id!==r.id&&active(x)&&String(x.room)===String(r.room)&&x.checkedIn&&x.checkin<=iso(today)&&x.checkout>iso(today));
 if(conflict)return alert('Já existe um hóspede registrado neste quarto.');
 modal('Confirmar check-in',`<p>Confirmar a entrada de <b>${guest(r.guestId).name}</b> no quarto <b>${r.room}</b>?</p><p class="muted">Entrada prevista: ${fmt(r.checkin)} · Saída prevista: ${fmt(r.checkout)}</p><div class="field"><label>Observações (opcional)</label><textarea id="checkinNote" rows="2" placeholder="Ex.: entrega das chaves, quantidade de bagagens..."></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmCheckin(${id})">Confirmar check-in</button></div>`);
}
function confirmCheckin(id){
 let r=db.reservations.find(x=>x.id===id);if(!r)return;
 r.checkedIn=true;r.checkedInAt=iso(today);r.checkedInTime=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});r.checkinNote=$('#checkinNote')?.value||'';
 save();closeModal();render();
}
function cancelCheckin(id){
 let r=db.reservations.find(x=>x.id===id);if(!r||!r.checkedIn||r.closed)return;
 modal('Cancelar check-in',`<p>Deseja realmente retirar o registro de entrada de <b>${guest(r.guestId).name}</b> no quarto <b>${r.room}</b>?</p><div class="field"><label>Motivo da correção (obrigatório)</label><textarea id="cancelCheckinReason" rows="3" required placeholder="Ex.: check-in registrado por engano pelo funcionário"></textarea></div><p class="muted">A reserva continuará ativa. Os pagamentos e demais dados não serão apagados. O quarto voltará a aparecer como reservado, se estiver dentro do período.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Voltar</button><button class="btn" onclick="confirmCancelCheckin(${id})">Confirmar correção</button></div>`);
}
function confirmCancelCheckin(id){
 let r=db.reservations.find(x=>x.id===id);if(!r||!r.checkedIn||r.closed)return;
 let reason=($('#cancelCheckinReason')?.value||'').trim();if(!reason)return alert('Informe o motivo da correção.');
 r.checkinHistory ||= [];
 r.checkinHistory.push({action:'Check-in cancelado',date:iso(today),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),reason,previousDate:r.checkedInAt||null});
 r.checkedIn=false;delete r.checkedInAt;delete r.checkedInTime;r.checkinCorrectionNote=reason;
 save();closeModal();render();
}
function checkoutReservation(id){
 let r=db.reservations.find(x=>x.id===id);if(!r)return;
 let items=db.charges.filter(x=>x.reservationId==id);
 let extra=items.reduce((s,x)=>s+Number(x.total||0),0);
 let extraPaid=items.filter(x=>x.paid).reduce((s,x)=>s+Number(x.total||0),0);
 let due=Math.max(0,Number(r.total||0)+extra-Number(r.paid||0)-extraPaid);
 modal('Check-out e fechamento financeiro',`<p><b>${guest(r.guestId).name}</b> · Quarto <b>${r.room}</b></p>
 <div class="pricebox"><p>Total da hospedagem e extras: <b>${money(Number(r.total||0)+extra)}</b></p><p>Já recebido anteriormente: <b>${money(Number(r.paid||0)+extraPaid)}</b></p><p>Saldo a receber no check-out: <b id="checkoutDue">${money(due)}</b></p></div>
 <div class="field"><label>O saldo foi pago agora?</label><select id="checkoutPaid" onchange="toggleCheckoutPayments()"><option value="yes">Sim, vou registrar o recebimento</option><option value="no">Não, ficou pendente</option></select></div>
 <div id="checkoutPaymentArea"><div id="checkoutPaymentRows"></div><button type="button" class="btn secondary" onclick="addCheckoutPaymentRow()">＋ Adicionar outra forma de pagamento</button><div class="pricebox" id="checkoutPaymentSum">Total informado: ${money(0)}</div></div>
 <div class="field"><label>Observações do check-out (opcional)</label><textarea id="checkoutNote" rows="2" placeholder="Ex.: conferência do quarto, saldo combinado, observações da recepção..."></textarea></div>
 <p class="muted">Após confirmar, a hospedagem será movida para Reservas finalizadas e o quarto ficará em Limpeza. Os valores recebidos serão lançados no caixa do dia.</p>
 <div class="actions"><button class="btn secondary" onclick="closeModal()">Voltar</button><button class="btn" onclick="confirmCheckout(${id},${due})">Confirmar check-out</button></div>`);
 window._checkoutReservationId=id;window._checkoutDue=due;window._checkoutRowCount=0;
 addCheckoutPaymentRow();
}

}
function addCheckoutPaymentRow(){

 let div=document.createElement('div');div.className='checkout-payment-row formgrid';div.style.cssText='padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;align-items:end';

function updateCheckoutPaymentSum(){

function confirmCheckout(id,due){
 let r=db.reservations.find(x=>x.id===id);if(!r)return;
 let items=[];
 if($('#checkoutPaid')?.value!=='no'){
  items=[...document.querySelectorAll('.checkout-payment-row')].map(row=>({method:row.querySelector('[name=method]').value,amount:Number(row.querySelector('[name=amount]').value||0)})).filter(x=>x.amount>0);
  let total=items.reduce((s,x)=>s+x.amount,0);
  if(total>due+0.001)return alert('O valor recebido não pode ultrapassar o saldo pendente de '+money(due)+'.');
  if(due>0.001&&total<=0)return alert('Informe o valor recebido ou selecione que o saldo ficou pendente.');
 }
 items.forEach((it,i)=>{
  r.paid=Number(r.paid||0)+it.amount;
  db.cashMovements ||= [];db.payments ||= [];
  let stamp=Date.now()+i;
  db.cashMovements.push({id:stamp,date:iso(today),type:'Entrada',description:'Check-out / hospedagem - quarto '+r.room+' - '+guest(r.guestId).name,amount:it.amount,method:it.method,shiftId:db.activeShiftId||null,reservationId:r.id});
  db.payments.push({id:stamp,reservationId:r.id,date:iso(today),method:it.method,amount:it.amount,source:'Check-out'});
 });
 r.closed=true;r.status='Finalizada';r.closeReason='Check-out realizado';r.closedAt=iso(today);r.closedTime=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});r.closeNote=$('#checkoutNote')?.value||'';
 r.checkoutPaymentsRecorded=items.reduce((s,x)=>s+x.amount,0);
 r.checkoutBalancePending=Math.max(0,due-r.checkoutPaymentsRecorded);
 let room=db.rooms.find(x=>String(x.number)===String(r.room));if(room)room.status='Limpeza';
 save();closeModal();pageNav('reservations');
}

function calendarPage(c){let start=new Date(today);start.setDate(1);let offset=(start.getDay()+6)%7;let first=addDays(start,-offset);let days=Array.from({length:42},(_,i)=>addDays(first,i));c.innerHTML=title('Calendário de ocupação','Visão mensal das reservas por data.',`<button class="btn secondary" onclick="pageNav('reservations')">Gerenciar reservas</button>`)+`<section class="panel"><div class="panel-head"><button class="btn secondary" onclick="changeMonth(-1)">←</button><h3 id="monthLabel"></h3><button class="btn secondary" onclick="changeMonth(1)">→</button></div><div class="calendar" id="calendarGrid"></div></section>`;window.calMonth=start.getMonth();window.calYear=start.getFullYear();drawCalendar()}
function changeMonth(n){window.calMonth+=n;if(window.calMonth<0){window.calMonth=11;window.calYear--}if(window.calMonth>11){window.calMonth=0;window.calYear++}drawCalendar()}
function drawCalendar(){let first=new Date(window.calYear,window.calMonth,1),offset=(first.getDay()+6)%7,begin=addDays(first,-offset),days=Array.from({length:42},(_,i)=>addDays(begin,i));$('#monthLabel').textContent=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});$('#calendarGrid').innerHTML=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div style="font-size:11px;color:var(--muted);padding:5px">${x}</div>`).join('')+days.map(d=>{let date=iso(d),rs=db.reservations.filter(r=>active(r)&&r.checkin<=date&&r.checkout>date).slice(0,2);let total=db.rooms.filter(r=>!['Manutenção','Bloqueado'].includes(r.status)).length;let occupied=db.rooms.filter(room=>db.reservations.some(r=>active(r)&&String(r.room)===String(room.number)&&r.checkin<=date&&r.checkout>date)).length;let pct=total?Math.round(occupied/total*100):0;return `<div class="day" style="${d.getMonth()!==window.calMonth?'opacity:.4':''}"><b>${d.getDate()}</b><div class="day-occupancy"><strong>${pct}%</strong><small>${occupied}/${total} quartos</small></div><div class="occupancy-track"><i style="width:${pct}%"></i></div>${rs.map(r=>`<div class="bar" title="${guest(r.guestId).name}">Q${r.room} · ${guest(r.guestId).name.split(' ')[0]}</div>`).join('')}</div>`}).join('')}

function newCharge(reservationId=null){

 let selectedReservation=reservationId||window._chargeReturnReservationId||'';
 modal('Lançar consumo ou serviço',`<form id="chargeForm">

 <div class="field"><label>Quantidade</label><input name="quantity" id="chargeQty" type="number" min="1" value="1" required></div><div class="field"><label>Preço unitário (R$)</label><input name="price" id="chargePrice" type="number" min="0" step=".01" required></div>
 <div class="field full" id="parkingPlateField" style="display:none"><label>Placa do veículo *</label><input name="vehiclePlate" id="chargeVehiclePlate" placeholder="ABC1D23"></div><div class="field full"><label>Forma de pagamento</label><select name="paymentMode"><option>Pagamento imediato</option><option>Conta do quarto</option></select></div></div>
 <div class="pricebox" id="chargeCalc">Total: —</div>
 <div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Registrar lançamento</button></div></form>`);
 let form=$('#chargeForm'),kind=$('#chargeKind'),item=$('#chargeItem'),price=$('#chargePrice'),qty=$('#chargeQty');
 function fillItems(){let arr=kind.value==='product'?db.products.filter(p=>p.active):db.services.filter(s=>s.active);item.innerHTML=arr.map(a=>`<option value="${a.id}">${a.name} · ${money(a.price)} / ${a.unit||'unidade'}</option>`).join('');if(arr[0])price.value=arr[0].price;toggleParkingPlate();calc()}

 kind.onchange=fillItems;item.onchange=()=>{let arr=kind.value==='product'?db.products:db.services,found=arr.find(a=>a.id==item.value);if(found)price.value=found.price;toggleParkingPlate();calc()};price.oninput=calc;qty.oninput=calc;fillItems();

function breakfastExpected(){
 let out=[];
 db.charges.filter(ch=>ch.kind==='service'&&!ch.breakfastConsumption&&/café\s*da\s*manhã/i.test(ch.description||'')).forEach(ch=>{
  let r=db.reservations.find(x=>x.id==ch.reservationId);if(!r||!active(r)||!(r.checkin<=iso(today)&&r.checkout>iso(today)))return;
  let n=Math.max(1,Number(ch.quantity||1)),found=out.find(x=>x.reservationId===r.id);
  if(found)found.quantity+=n;else out.push({reservationId:r.id,room:String(r.room),guestName:guest(r.guestId).name,quantity:n});
 });return out;
}

 db.breakfastAttendance ||= [];

function recordBreakfast(reservationId,room,expected){
 let old=db.breakfastAttendance.find(x=>x.date===iso(today)&&x.reservationId===reservationId&&String(x.room)===String(room));
 let service=db.services.find(x=>x.active&&/café\s*da\s*manhã/i.test(x.name||''));
 if(!service)return alert('Cadastre e ative o serviço “Café da manhã” em Serviços antes de confirmar o consumo.');
 let unitPrice=Number(service.price||0);
 modal('Confirmar café consumido',`<form id="breakfastForm"><p>Quarto <b>${room}</b> · Pessoas previstas: <b>${expected}</b></p><div class="field"><label>Quantas pessoas realmente tomaram café?</label><input name="served" type="number" min="0" max="50" value="${old?.served??expected}" required></div><div class="notice">Valor por pessoa: <b>${money(unitPrice)}</b>. O total será lançado automaticamente na conta do quarto.</div><div class="field"><label>Observação</label><input name="notes" value="${old?.notes||''}" placeholder="Opcional"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Confirmar e lançar no extrato</button></div></form>`);
 $('#breakfastForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),servedCount=Number(f.get('served'));if(!Number.isInteger(servedCount)||servedCount<0||servedCount>50)return alert('Informe uma quantidade válida.');
  let reservation=db.reservations.find(r=>r.id===reservationId)||db.reservations.find(r=>String(r.room)===String(room)&&r.checkedIn&&active(r)&&r.checkin<=iso(today)&&r.checkout>iso(today));
  if(!reservation)return alert('Não foi possível localizar a hospedagem ativa deste quarto. O café não foi lançado.');
  let obj=old||{id:Date.now(),date:iso(today),reservationId:reservation.id,room:String(room),guestName:guest(reservation.guestId).name};
  obj.reservationId=reservation.id;obj.served=servedCount;obj.notes=f.get('notes').trim();obj.chargeId ||= null;
  let existingCharge=obj.chargeId?db.charges.find(ch=>ch.id===obj.chargeId):null;
  if(servedCount>0){
   if(existingCharge){existingCharge.quantity=servedCount;existingCharge.unitPrice=unitPrice;existingCharge.total=servedCount*unitPrice;existingCharge.description='Café da manhã';existingCharge.itemId=service.id;existingCharge.breakfastConsumption=true;existingCharge.paid=false;existingCharge.paymentMode='Conta do quarto';}
   else {let charge={id:Date.now()+1,reservationId:reservation.id,date:iso(today),kind:'service',itemId:service.id,description:'Café da manhã',breakfastConsumption:true,quantity:servedCount,unitPrice,total:servedCount*unitPrice,paymentMode:'Conta do quarto',paid:false};db.charges.push(charge);obj.chargeId=charge.id;}
  } else if(existingCharge){db.charges=db.charges.filter(ch=>ch.id!==existingCharge.id);obj.chargeId=null;}
  if(!old)db.breakfastAttendance.push(obj);save();closeModal();render();
 };
}

async function lookupGuestCep(formId){
 let form=document.getElementById(formId);if(!form)return;
 let cep=(form.elements.namedItem('zip')?.value||'').replace(/\\D/g,'');
 if(cep.length!==8){alert('Digite um CEP válido com 8 números.');return;}
 let btn=form.querySelector('[data-cep-button]');if(btn){btn.disabled=true;btn.textContent='Buscando...';}
 try{
  let response=await fetch('https://viacep.com.br/ws/'+cep+'/json/');
  if(!response.ok)throw new Error('Falha na consulta');
  let data=await response.json();
  if(data.erro){alert('CEP não encontrado. Confira os números ou preencha o endereço manualmente.');return;}
  const set=(name,value)=>{let el=form.elements.namedItem(name);if(el&&value)el.value=value;};
  set('street',data.logradouro);set('neighborhood',data.bairro);set('city',data.localidade);set('state',data.uf);
  form.elements.namedItem('number')?.focus();
 }catch(err){alert('Não foi possível consultar o CEP agora. Verifique sua conexão e preencha o endereço manualmente.');}
 finally{if(btn){btn.disabled=false;btn.textContent='Buscar CEP';}}
}

  if(roomConflict)return alert('Conflito: este quarto já possui reserva no período.');
  let base=Number(v.baseTotal||0),disc=Number(v.discount||0);
  if(disc>base)return alert('O desconto não pode ser maior que o valor da hospedagem.');
  let final=Math.max(0,base-disc);
  let total=final;
  let data={...v,guestId:Number(v.guestId),adults:Number(v.adults),children:Number(v.children),baseTotal:base,discount:disc,total,paid:Number(v.paid||0),companions:v.companions||'',notes:v.notes||''};
  if(r){
   let changed=[];
   if(r.checkin!==data.checkin)changed.push({field:'Check-in',from:r.checkin,to:data.checkin});
   if(r.checkout!==data.checkout)changed.push({field:'Check-out',from:r.checkout,to:data.checkout});
   if(changed.length){
    r.dateHistory ||= [];
    r.dateHistory.push({changedAt:iso(today),changedTime:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),changes:changed,reason:$('#dateCorrectionReason')?.value||'Correção administrativa'});
   }
   Object.assign(r,data);
  } else db.reservations.push({id:Date.now(),...data});
  save();closeModal();render();
 };
}

function registerPayment(id){
 let r=db.reservations.find(a=>a.id===id);
 let charges=db.charges.filter(x=>x.reservationId==id);
 let extras=charges.reduce((s,x)=>s+Number(x.total||0),0);
 let extraPaid=charges.filter(x=>x.paid).reduce((s,x)=>s+Number(x.total||0),0);
 let due=Number(r.total||0)+extras-Number(r.paid||0)-extraPaid;
 modal('Registrar pagamento',`<p><b>Reserva #HS-${String(id).padStart(4,'0')}</b> · ${guest(r.guestId).name}</p>
 <p class="muted">Saldo pendente: <b>${money(Math.max(0,due))}</b></p>
 <form id="payForm"><div id="paymentRows"></div>
 <button type="button" class="btn secondary" onclick="addPaymentRow()">＋ Adicionar outra forma de pagamento</button>
 <div class="pricebox" id="paymentSum">Total informado: ${money(0)}</div>
 <div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Registrar pagamento</button></div></form>`);
 window._paymentReservationId=id; window._paymentRowCount=0; addPaymentRow();
 $('#payForm').onsubmit=e=>{
  e.preventDefault();let rows=[...document.querySelectorAll('.payment-row')],items=rows.map(row=>({method:row.querySelector('[name=method]').value,amount:Number(row.querySelector('[name=amount]').value||0)})).filter(x=>x.amount>0);
  let total=items.reduce((s,x)=>s+x.amount,0);
  if(!items.length)return alert('Informe pelo menos uma forma de pagamento.');
  if(total>due+0.001)return alert('A soma dos pagamentos não pode ultrapassar o saldo pendente de '+money(due)+'.');
  items.forEach((it,i)=>{
   r.paid=Number(r.paid||0)+it.amount;
   db.cashMovements.push({id:Date.now()+i,date:iso(today),type:'Entrada',description:'Pagamento hospedagem - quarto '+r.room,amount:it.amount,method:it.method,shiftId:db.activeShiftId||null,reservationId:r.id});
   db.payments ||= [];
   db.payments.push({id:Date.now()+i, reservationId:r.id,date:iso(today),method:it.method,amount:it.amount});
  });
  save();closeModal();render();
 };
}
